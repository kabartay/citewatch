name: Bug report
description: Citewatch shows the wrong thing, or nothing
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Citewatch and VS Code versions
      description: The Citewatch version is in the Extensions panel and on the log's first line (`Citewatch X.Y.Z activated`).
      placeholder: Citewatch X.Y.Z, VS Code X.Y, macOS / Windows / Linux
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What the status bar shows
      description: The item's text and its tooltip, or a screenshot.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Citewatch log
      description: |
        Run **Citewatch: Show Log** and paste the last few lines. The log never contains your token,
        but it can include file names and DOIs, so check it before posting.
      render: text
    validations:
      required: true
